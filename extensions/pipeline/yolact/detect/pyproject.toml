[project]
name = "finspotter-yolact"
version = "0.0.0"
requires-python = "==3.13.*"
dependencies = [
  "cython",
  "finspotter-pipeline-client",
  "numpy",
  "opencv-python-headless",
  "pycocotools",
  "torch",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yolact_cpu"]

[tool.uv.sources]
finspotter-pipeline-client = { workspace = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true